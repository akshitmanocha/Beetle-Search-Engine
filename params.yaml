ETL:
  crawler:
    max_depth: 5
    sleep_time: 0
    max_urls_per_seed: 5000
  parser:
    min_word_count: 100
  heuristic_labeling:
    score_threshold: 8

models:
  embedding:
    model_name: google/embeddinggemma-300m
    batch_size: 32
    # device is resolved at runtime by src/config.py (mps > cuda > cpu); not set here.
  reranker:
    model_name: Alibaba-NLP/gte-reranker-modernbert-base
  splade:
    model_name: naver/splade-cocondenser-ensembledistil
search:
  method: "splade"
  top_k: 10
  rerank_k: 10
  reranker: true